[package]
name = "game2-client"
version = "0.1.0"
edition = "2021"

# The client: draws a UiModel (the View, art, panels, HUD), the desktop
# window (game_ui), headless dumps, the render bench and recordings. It sits
# on game2-core and sees only its public API; game2-core never depends on it.

[features]
default = []
# The 4x speed key: solo-play only while the flag rides out its deprecation
# Push-to-talk dev feedback (#1083): hold a key, talk about a bug, and a
# locally-transcribed clip lands as a filed GitHub issue. Native-only, so
# the mic dep stays behind the flag and off every normal build; the
# transcription itself is a fetched whisper-cli binary (scripts/get-whisper.ps1),
# so no C++ toolchain is ever needed
dev-voice = ["dep:cpal"]

[dependencies]
game2-core = { path = "../game2-core" }
# WAV output moved here (#1486); sound_dump's scenario library is the
# audio crate's harness file, always on for the client (#1493)
game2-audio = { path = "../game2-audio", features = ["scenarios"] }
gif = "0.13"
jpeg-encoder = "0.6"
png = "0.18.1"
serde_json = "1"
tungstenite = "0.26"

# The desktop window only: wasm blits the Buffer to a canvas itself, and
# wasm32 has no minifb to build against (bins need it, the lib doesn't)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minifb = "0.29.0"
# dev-voice only: mic in - a dev tool, never wasm
cpal = { version = "0.15", optional = true }

[lints.rust]
# warnings are errors: keep the build clean
warnings = "deny"
