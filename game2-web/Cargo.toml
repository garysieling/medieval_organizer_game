[package]
name = "game2-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
game2-core = { path = "../game2-core", default-features = false }
wasm-bindgen = "0.2"
serde_json = "1"

# wasm has no std net/filesystem: Art loads via fetched bytes, the ws rides a
# browser-provided extern shim
