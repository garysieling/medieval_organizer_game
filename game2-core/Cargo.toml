[package]
name = "game2-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
# The 4x speed key: solo-play only while the flag rides out its deprecation

[dependencies]
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.26"
# No external dependencies for simplicity
# Using std library only

# wasm32's std has no clock (Instant::now panics): web-time gives the
# same Instant off performance.now() in a browser. Perf marks and
# telemetry spans call Instant unconditionally in the frame path.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1"

[lints.rust]
# warnings are errors: keep the build clean
warnings = "deny"

[dev-dependencies]
# Add test dependencies as needed
