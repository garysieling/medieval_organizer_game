[package]
name = "game2-client"
version = "0.1.0"
edition = "2021"

# The client: draws a UiModel (the View, art, panels, HUD), the desktop
# window (game_ui), headless dumps, the render bench and recordings. It sits
# on game2-core and sees only its public API; game2-core never depends on it.

[features]
default = []
# The 4x speed key: solo-play only while the flag rides out its deprecation

[dependencies]
game2-core = { path = "../game2-core" }
gif = "0.13"
jpeg-encoder = "0.6"
png = "0.18.1"
serde_json = "1"
tungstenite = "0.26"

# The desktop window only: wasm blits the Buffer to a canvas itself, and
# wasm32 has no minifb to build against (bins need it, the lib doesn't)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minifb = "0.29.0"

[lints.rust]
# warnings are errors: keep the build clean
warnings = "deny"
