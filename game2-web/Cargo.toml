[package]
name = "game2-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
game2-core = { path = "../game2-core", default-features = false }
wasm-bindgen = "0.2"
serde_json = "1"

# wasm has no std net/filesystem: Art loads via fetched bytes, the ws rides a
# browser-provided extern shim

# getrandom 0.3's wasm_js backend needs the feature on - scoped to the
# wasm target so native builds don't reach for a backend that isn't there
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
