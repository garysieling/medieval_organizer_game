[workspace]
members = [
    "game2-core",
    "game2-client",
    "game2-web",
]
resolver = "2"

# The game is a software renderer - it repaints a 1440x960 buffer every
# frame, which is unusably slow unoptimized. Optimize our own crate in dev
# builds (PLAY.md runs `cargo run --bin game_ui`, a dev-profile binary) while
# keeping debug info and assertions.
[profile.dev.package.game2-core]
opt-level = 2

# the client repaints the frame too
[profile.dev.package.game2-client]
opt-level = 2

[workspace.dependencies]
# Add shared dependencies here as needed
